[tools]
actionlint = "1.7.12"
hk = "2.6.0"
lua-language-server = "3.19.2"
pkl = "0.32.1"
shellcheck = "0.11.0"
stylua = "2.6.0"

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/ lib/"

[tasks.lint]
description = "Lint Lua scripts, shell tests and GitHub Actions using hk"
run = "hk check --all"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix --all"

[tasks.test]
description = "Run the tests"
run = 'for t in tests/*.test.sh; do sh "$t" || exit 1; done'

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test"]
